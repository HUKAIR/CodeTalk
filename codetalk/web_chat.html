<header><span><b>CodeTalk</b> // <span data-i18n="tagline">接地对话 · 本地优先 · 模型调用按配置</span></span>

<main>
  <button id="filesbtn" type="button" aria-controls="ftdrawer" aria-expanded="false" data-i18n="files_btn">文件 ▸</button>
  <aside id="ftdrawer" inert aria-hidden="true" aria-label="Files"></aside>
  <p class="hint" data-i18n="hint">问「这段代码当初为什么这么写」——答案接地到真实 commit / 决策 / 会话原话;
    无 key 或 --no-llm 时降级为零-LLM 接地罗列(不出网)。</p>
  <div id="log" aria-live="polite" aria-relevant="additions text"></div>
  <button id="latest" type="button" hidden data-i18n="latest">回到最新</button><div id="shint" class="hint"></div>
  <form id="f">
    <textarea id="q" data-i18n-ph="q_ph" placeholder="例:为什么把重试从装饰器改成显式循环?(可带 文件:行)"></textarea>
    <button id="send" type="submit" data-i18n="send">问</button>
  </form>
</main>
