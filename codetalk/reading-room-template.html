<template id="room-template">
<div class="desk reading-room">
  <aside class="archive-index">
    <div class="index-label" data-room-zh="你的工作，值得被理解。" data-room-en="Your work, worth understanding."></div>
    <h1><span class="room-heading" data-room-zh="决策书房" data-room-en="Decision reading room"></span><span>THE READING ROOM</span></h1>
    <div class="index-divider"></div>
    <div class="b-row b-between"><span class="b-tiny" data-room-zh="这本项目档案" data-room-en="This project archive"></span><span class="b-tiny b-muted" id="room-total"></span></div>
    <div id="chapter-list" class="chapter-list" aria-label="提交章节"></div>
    <div class="archive-folder"><div class="mini-sheet s3" data-room-zh="原始提交" data-room-en="Original commit"></div><div class="mini-sheet s2" data-room-zh="决策笔记" data-room-en="Decision notes"></div><div class="mini-sheet s1" data-room-zh="来源索引" data-room-en="Source index"></div><button class="folder-face" id="room-folder"><span class="b-folder-symbol">⌑</span><span class="room-project">$project</span><small data-room-zh="打开来源档案 ↗" data-room-en="Open source archive ↗"></small></button></div>
    <div class="index-foot"><span class="small-dot"></span><span data-room-zh="本机 Git · 原始记录" data-room-en="Local Git · original records"></span><br><span id="room-mode-note"></span></div>
  </aside>
  <section class="reading-desk">
    <div class="desk-toolbar b-row b-between"><div class="b-row b-gap"><span class="b-tiny b-muted" data-room-zh="项目记录" data-room-en="Project records"></span><span class="b-tiny b-muted">/</span><span id="room-chapter-label" class="b-tiny"></span></div><div class="b-row b-gap"><button class="text-button" id="room-diff"><span data-room-icon="layers"></span><span data-room-zh="对照版本" data-room-en="Compare versions"></span></button><button class="b-iconbtn" id="room-bookmark" aria-label="添加书签" aria-pressed="false" data-room-icon="pin"></button></div></div>
    <div class="book-stage"><div class="under-sheet u2"></div><div class="under-sheet u1"></div>
      <article class="reading-page" id="room-page">
        <div class="page-top b-row b-between"><span class="page-kicker"><span data-room-zh="决策档案" data-room-en="Decision archive"></span><span id="room-number"></span></span><span class="page-date" id="room-date"></span></div>
        <div class="page-title-row"><h2 id="room-title"></h2><div class="archive-seal"><span data-room-zh="提交所载" data-room-en="In this commit"></span><b id="room-file-count"></b><small data-room-zh="涉及文件" data-room-en="changed files"></small></div></div>
        <p class="page-deck" id="room-summary"></p>
        <div class="artifact"><div class="artifact-head b-row b-between"><span data-room-zh="从这条记录，回到依据" data-room-en="Follow this record to its source"></span><button id="room-source-open" data-room-zh="查看原始记录 ↗" data-room-en="Open original record ↗"></button></div><div class="flow-diagram"><div class="record-cube"><span class="cube-cap"></span><span data-room-icon="layers"></span><b data-room-zh="原始提交" data-room-en="Original commit"></b><small id="room-cube-sha"></small></div><div class="flow-bridge"><span></span><i></i><small data-room-zh="同一份依据" data-room-en="Same source"></small></div><div class="views-stack"><button class="view-slice" id="room-flow-source"><span class="view-dot"></span><span data-room-zh="提交原文" data-room-en="Commit message"></span></button><button class="view-slice" id="room-flow-diff"><span class="view-dot"></span><span data-room-zh="改动对照" data-room-en="Actual diff"></span></button><button class="view-slice" id="room-flow-files"><span class="view-dot"></span><span data-room-zh="文件视图" data-room-en="File view"></span></button></div></div><div class="artifact-caption"><span class="legend-preserve"></span><span data-room-zh="原文保留" data-room-en="Source preserved"></span><span class="legend-update"></span><span data-room-zh="解释单独标注" data-room-en="Interpretation labeled separately"></span></div></div>
        <div class="page-body"><span class="paragraph-mark">§</span><div><h3 data-room-zh="当时写下的决定" data-room-en="Decisions recorded at the time"></h3><p id="room-body-copy"></p><button class="footnote" id="room-citation" aria-label="查看引用">[1]</button></div></div>
        <details class="room-interpretation"><summary data-room-zh="缓存解释与胶囊" data-room-en="Cached interpretation & capsules"></summary><div id="room-interpretation-body"></div></details>
        <div class="page-bottom b-row b-between"><span class="b-mono" id="room-sha"></span><button id="room-next-page"><span data-room-zh="下一篇" data-room-en="Next entry"></span><span data-room-icon="arrow"></span></button></div>
      </article>
    </div>
    <div class="chapter-ruler"><span id="room-first-date"></span><div class="ruler-track" id="room-ruler-track"></div><span id="room-last-date"></span><button id="room-prev" aria-label="上一篇">←</button><span id="room-position"></span><button id="room-next" aria-label="下一篇">→</button></div>
  </section>
  <aside class="margin-notes"><div class="margin-label" data-room-zh="阅读旁注" data-room-en="Reading notes"></div>
    <div class="source-note" id="room-note"><div class="note-tab" data-room-zh="原文 01" data-room-en="Source 01"></div><span class="source-type" data-room-zh="Git 提交原文" data-room-en="Original Git message"></span><h3 id="room-note-title"></h3><blockquote id="room-quote"></blockquote><div class="source-line"></div><span class="b-mono" id="room-note-source"></span><button id="room-more-context"><span data-room-zh="展开原文上下文" data-room-en="Expand original context"></span><span>＋</span></button><pre id="room-context" hidden></pre></div>
    <div class="alternative-note"><span class="note-pin"></span><div class="b-tiny" data-room-zh="另一个曾被考虑的方向" data-room-en="An alternative considered"></div><h3 data-room-zh="曾经否决" data-room-en="Previously rejected"></h3><p id="room-rejected"></p><span class="note-sign" data-room-zh="保留理由，而不只保留结果。" data-room-en="Keep the reasons, not just the result."></span></div>
    <div class="room-watch-note" id="room-watches"></div>
    <div class="page-bookmark"><span data-room-icon="book"></span><p data-room-zh="读到这里，下次接着。书签只保存在这个浏览器。" data-room-en="Pick up where you left off. Bookmarks stay in this browser."></p></div>
  </aside>
</div>
<div class="decision-tray"><div class="tray-question"><span class="tray-icon" data-room-icon="check"></span><div><b data-room-zh="核对历史，再判断当前改动。" data-room-en="Read the history, then review today's change."></b><small id="room-receipt" role="status"></small></div></div><div class="tray-choices"><button id="room-tray-source" data-room-zh="查看原文" data-room-en="Source"></button><button id="room-tray-diff" data-room-zh="对照改动" data-room-en="Compare"></button><button id="room-read" data-room-zh="记为已回看" data-room-en="Mark read"></button></div><a class="tray-save" id="room-review"><span data-room-zh="审查当前改动" data-room-en="Review changes"></span><span data-room-icon="arrow"></span></a></div>
<dialog id="room-compare"><div class="compare-header b-row b-between"><div><span class="b-tiny b-muted" data-room-zh="同一条提交 · 真实 Git diff" data-room-en="One commit · actual Git diff"></span><h2 data-room-zh="让变化，清楚一点。" data-room-en="Make the change clear."></h2></div><button class="b-iconbtn" id="room-close" aria-label="关闭对照" data-room-icon="close"></button></div><div class="compare-labels"><span data-room-zh="改动前（−）" data-room-en="Before (−)"></span><span data-room-zh="改动后（+）" data-room-en="After (+)"></span></div><div id="room-diff-body" aria-live="polite"></div><div class="compare-footer" data-room-zh="仅展示 diff 中的上下文与增删行，最多 8,000 字符，不代表完整文件。" data-room-en="Diff context, removed and added lines only; limited to 8,000 characters, not complete files."></div></dialog>
</template>
